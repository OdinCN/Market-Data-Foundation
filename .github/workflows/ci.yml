name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false
      - name: Install repository Python baseline
        run: uv python install
      - name: Sync committed dependency lock
        run: uv sync --locked --group dev
      - name: Build package
        run: uv build
      - name: Check repository hygiene
        run: uv run --locked python scripts/check_repository_hygiene.py
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Run deterministic tests
        run: uv run --locked pytest -m 'not live_provider and not postgres_integration'

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false
      - name: Install repository Python baseline
        run: uv python install 3.14.8
      - name: Sync committed Python dependency lock for offline ASGI fixtures
        run: uv sync --locked --group dev
      - name: Install committed frontend dependency lock
        working-directory: web
        run: npm ci
      - name: Check frontend types
        working-directory: web
        run: npm run check
      - name: Check frontend formatting
        working-directory: web
        run: npm run format:check
      - name: Check frontend contracts
        working-directory: web
        run: npm run contract:check
      - name: Run all frontend tests with offline ASGI fixtures
        working-directory: web
        env:
          MDF_SUBMIT_EVIDENCE: ${{ runner.temp }}/collection-matrix.json
        run: npm test
      - name: Build frontend
        working-directory: web
        run: npm run build
      - name: Install Chromium for the collection workflow
        working-directory: web
        run: npx --no-install playwright install --with-deps chromium
      - name: Exercise the built collection workbench for every registered asset
        run: node web/scripts/check-collection-submit.mjs "$RUNNER_TEMP/collection-matrix.json" "$RUNNER_TEMP/collection-browser"
